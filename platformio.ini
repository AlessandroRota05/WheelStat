; WheelStat - PlatformIO project, for those who prefer VS Code to the Arduino
; IDE. The sketch is the same: WheelStat.ino in this folder and the code in
; src/. Hardware and language choices stay in Config.h.
;
;   pio run                     build for the classic ESP32
;   pio run -e esp32s3          build for another chip of the family
;   pio run -t upload           build and flash
;   pio test -e native          run the tests of src/core on this PC

[platformio]
; An Arduino sketch keeps its .ino next to src/, not inside it.
src_dir = .
default_envs = esp32

[esp32_family]
; The community build of the Espressif platform: it tracks the Arduino core
; 3.x this firmware is developed on. The official one stops at core 2.0.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
; PlatformIO turns the sketch into WheelStat.ino.cpp before compiling: that is
; the name the filter has to let through.
build_src_filter = +<*.ino.cpp> +<src/>
monitor_speed = 115200
board_build.filesystem = littlefs
; Every driver that Config.h can select, so switching one needs no change
; here. Only the ones actually included end up in the firmware.
lib_deps =
  mikalhart/TinyGPSPlus
  adafruit/Adafruit BNO055
  adafruit/Adafruit Unified Sensor
  adafruit/Adafruit GFX Library
  adafruit/Adafruit SSD1306
  adafruit/Adafruit SH110X
  adafruit/DHT sensor library
  adafruit/Adafruit SHT4x Library
  adafruit/Adafruit SHT31 Library
  adafruit/Adafruit HTU31D Library
  adafruit/Adafruit Si7021 Library
  adafruit/Adafruit HTU21DF Library
  adafruit/Adafruit AHTX0
  adafruit/Adafruit BME280 Library

[env:esp32]
extends = esp32_family
board = esp32doit-devkit-v1

[env:esp32s3]
extends = esp32_family
board = esp32-s3-devkitc-1

[env:esp32s2]
extends = esp32_family
board = esp32-s2-saola-1

[env:esp32c3]
extends = esp32_family
board = esp32-c3-devkitm-1

; The part of the firmware that does not touch the hardware, compiled for
; this PC together with its tests (test/). Needs a C++ compiler (g++).
[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter = +<src/core/>
build_flags = -std=gnu++17 -I. -DUNITY_INCLUDE_DOUBLE
